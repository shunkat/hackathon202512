name: PR Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  flutter-client:
    name: Flutter ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [analyze, test, build]
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        if: matrix.task == 'analyze'
        run: flutter analyze

      - name: Test
        if: matrix.task == 'test'
        run: flutter test

      - name: Build (web)
        if: matrix.task == 'build'
        run: flutter build web --release
