name: Firebase App Distribution

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ios-distribute:
    name: Distribute iOS build to Firebase
    runs-on: macos-14
    defaults:
      run:
        working-directory: client
    env:
      FIREBASE_PROJECT_ID: semantic-camera-hackthon
      FIREBASE_IOS_APP_ID: 1:950133384832:ios:23af39df468b7ae1cd2865
      IOS_BUNDLE_ID: com.example.client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set GOOGLE_APPLICATION_CREDENTIALS path
        run: echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase_key.json" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: cd ios && pod install --repo-update

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Setup Firebase auth (service account)
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_KEY_BASE64" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 is not set. Please add the base64 encoded service account JSON to secrets."
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY_BASE64" | base64 --decode > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Generate Firebase access token
        run: |
          python3 -m venv "$RUNNER_TEMP/firebase-venv"
          source "$RUNNER_TEMP/firebase-venv/bin/activate"
          python -m pip install --quiet --upgrade google-auth google-auth-httplib2
          FIREBASE_TOKEN=$(python - <<'PY'
          import os
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          creds = service_account.Credentials.from_service_account_file(
              os.environ["GOOGLE_APPLICATION_CREDENTIALS"],
              scopes=["https://www.googleapis.com/auth/cloud-platform"],
          )
          creds.refresh(Request())
          print(creds.token)
          PY
          )
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "Failed to generate Firebase access token from service account."
            exit 1
          fi
          echo "FIREBASE_TOKEN=$FIREBASE_TOKEN" >> "$GITHUB_ENV"

      - name: Download GoogleService-Info.plist
        run: |
          firebase apps:sdkconfig IOS "$FIREBASE_IOS_APP_ID" \
            --project "$FIREBASE_PROJECT_ID" \
            --out ios/Runner/GoogleService-Info.plist \
            --token "$FIREBASE_TOKEN"

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_CERT_P12_PASSWORD }}

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/hackathon.mobileprovision"

      - name: Create export options
        env:
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          cat > ios/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${IOS_PROVISIONING_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build iOS IPA (release)
        run: flutter build ipa --release --export-options-plist ios/exportOptions.plist

      - name: Distribute to Firebase App Distribution
        run: |
          firebase appdistribution:distribute build/ios/ipa/Runner.ipa \
            --app "$FIREBASE_IOS_APP_ID" \
            --project "$FIREBASE_PROJECT_ID" \
            --groups "hackathon" \
            --release-notes "GitHub Actions build for $GITHUB_SHA" \
            --token "$FIREBASE_TOKEN"
